name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake gcc-arm-none-eabi libnewlib-arm-none-eabi
      - name: Setup Pico SDK
        run: |
          git clone --depth 1 --branch 2.1.0 https://github.com/raspberrypi/pico-sdk.git /opt/pico-sdk
          cd /opt/pico-sdk && git submodule update --init --depth 1
          echo "PICO_SDK_PATH=/opt/pico-sdk" >> $GITHUB_ENV
      - name: Build firmware
        run: |
          cd firmware
          mkdir build && cd build
          cmake -DPICO_SDK_PATH=$PICO_SDK_PATH ..
          make -j$(nproc)
      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: firmware/build/streamdeck.uf2

  app-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: dtolnay/rust-toolchain@stable
      - name: Install & Build
        run: |
          cd app
          npm install
          npx tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: app-macos
          path: app/src-tauri/target/release/bundle/dmg/*.dmg

  app-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: dtolnay/rust-toolchain@stable
      - name: Install & Build
        run: |
          cd app
          npm install
          npx tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: app-windows
          path: app/src-tauri/target/release/bundle/nsis/*.exe

  app-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: dtolnay/rust-toolchain@stable
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev
      - name: Install & Build
        run: |
          cd app
          npm install
          npx tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: app-linux
          path: app/src-tauri/target/release/bundle/appimage/*.AppImage

  release:
    needs: [firmware, app-macos, app-windows, app-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: find artifacts -type f

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          draft: false
          generate_release_notes: true
