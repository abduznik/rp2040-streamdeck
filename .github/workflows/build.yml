name: Build All

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake gcc-arm-none-eabi libnewlib-arm-none-eabi
      - name: Setup Pico SDK
        run: |
          git clone --depth 1 --branch 2.1.0 https://github.com/raspberrypi/pico-sdk.git /opt/pico-sdk
          cd /opt/pico-sdk && git submodule update --init --depth 1
          echo "PICO_SDK_PATH=/opt/pico-sdk" >> $GITHUB_ENV
      - name: Build firmware
        run: |
          cd firmware
          mkdir build && cd build
          cmake -DPICO_SDK_PATH=$PICO_SDK_PATH ..
          make -j$(nproc)
      - uses: actions/upload-artifact@v4
        with:
          name: streamdeck.uf2
          path: firmware/build/streamdeck.uf2

  app-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Tauri CLI
        run: npm install --prefix app
      - name: Build macOS app
        run: cd app && npm run tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: StreamDeck-Config-macOS
          path: app/src-tauri/target/release/bundle/dmg/*.dmg

  app-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Tauri CLI
        run: npm install --prefix app
      - name: Build Windows app
        run: cd app && npm run tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: StreamDeck-Config-Windows
          path: app/src-tauri/target/release/bundle/nsis/*.exe

  app-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: dtolnay/rust-toolchain@stable
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev
      - name: Install Tauri CLI
        run: npm install --prefix app
      - name: Build Linux app
        run: cd app && npm run tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: StreamDeck-Config-Linux
          path: app/src-tauri/target/release/bundle/appimage/*.AppImage
