name: Build Firmware

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake gcc-arm-none-eabi libnewlib-arm-none-eabi

      - name: Setup Pico SDK
        uses: pico-sdk/actions/setup@v1
        with:
          sdk-version: '1.5.1'

      - name: Build firmware
        run: |
          cd firmware
          mkdir build && cd build
          cmake -DPICO_SDK_PATH=$PICO_SDK_PATH ..
          make -j$(nproc)

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: streamdeck.uf2
          path: firmware/build/streamdeck.uf2
